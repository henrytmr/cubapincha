<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CubaPincha — Oferta de trabajo</title>
<style>
:root{
  --tinta:#17263C; --noche:#1C2C3E; --indigo:#203F5A; --violeta:#2F5872;
  --cobre:#C8754D; --cobre-oscuro:#A85F3C; --cobre-suave:#F7EBE3;
  --menta:#63A38B; --sol:#D7A85E; --crema:#F7F5F0; --borde:#DDE3E5;
  --secundario:#56636D; --verificado:#17624C; --verificado-suave:#E3F0EB;
  --card:#ffffff;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--crema);color:var(--tinta);line-height:1.6}
a{color:var(--cobre-oscuro)}
/* Cabecera */
header.site{background:var(--tinta)}
header.site .wrap{max-width:720px;margin:0 auto;padding:.75em 1em;
  display:flex;align-items:center;justify-content:space-between;gap:1em}
.brand{display:inline-flex;align-items:center;gap:.55em;font-size:1.3em;font-weight:800;
  text-decoration:none;letter-spacing:-.01em;color:#fff}
.brand b{color:var(--sol);font-weight:800}
.monograma{position:relative;display:inline-flex;align-items:center;justify-content:center;
  width:1.9em;height:1.9em;border-radius:10px;background:var(--cobre);color:#fff;
  font-size:.72em;font-weight:800;letter-spacing:.02em;flex:none}
.monograma::after{content:"✦";position:absolute;top:-.55em;right:-.35em;
  color:var(--sol);font-size:.85em}
header.site nav a{color:#C9D4D9;text-decoration:none;font-size:.95em}
header.site nav a:hover{color:var(--sol)}
/* Contenido */
main{max-width:720px;margin:0 auto;padding:1em 1em 7em}
.card{background:var(--card);border:1px solid var(--borde);border-radius:14px;
  padding:1.25em 1.25em;box-shadow:0 1px 3px rgba(23,38,60,.08)}
.hero h1{font-size:1.7em;line-height:1.25;margin:.35em 0 .3em;letter-spacing:-.01em}
.chips{display:flex;flex-wrap:wrap;gap:.5em;align-items:center}
.chip{display:inline-block;background:var(--cobre-suave);color:var(--cobre-oscuro);
  border-radius:999px;padding:.2em .75em;font-size:.85em;font-weight:600}
.fecha{color:var(--secundario);font-size:.9em}
.company{font-size:1.08em;font-weight:700;margin:.1em 0}
.badge{display:inline-block;background:var(--verificado-suave);color:var(--verificado);
  border-radius:999px;padding:.1em .6em;font-size:.8em;font-weight:700;
  margin-left:.45em;vertical-align:.1em}
.lugar{color:var(--secundario);margin:.2em 0 0;display:flex;align-items:center;gap:.35em}
.lugar svg{flex:none}
/* Salario */
.salario{background:#FBF3EC;border:1px solid #EBD3BE;border-radius:12px;
  padding:1em 1.25em;margin-top:1.1em}
.salario .etiqueta{font-size:.8em;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;color:var(--cobre-oscuro);margin:0}
.salario .cantidad{font-size:1.55em;font-weight:800;color:var(--tinta);
  line-height:1.2;margin:.15em 0 0}
.salario .cantidad span{font-size:.6em;font-weight:600;color:var(--cobre-oscuro)}
.salario .notas{margin:.45em 0 0;color:var(--secundario);font-size:.95em}
/* Secciones */
h2.sec{font-size:.85em;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--secundario);margin:1.9em 0 .55em;padding-bottom:.35em;
  border-bottom:1px solid var(--borde)}
.desc p{margin:.4em 0}
ul.lista{margin:.4em 0;padding-left:1.25em}
ul.lista li{margin:.35em 0}
ul.lista li::marker{color:var(--cobre)}
/* Detalles */
.detalles{display:grid;grid-template-columns:1fr 1fr;gap:.6em}
.detalles div{background:var(--card);border:1px solid var(--borde);
  border-radius:10px;padding:.65em .9em}
.detalles dt{font-size:.78em;font-weight:700;letter-spacing:.04em;
  text-transform:uppercase;color:var(--secundario)}
.detalles dd{margin:.15em 0 0;font-weight:600}
@media (max-width:420px){.detalles{grid-template-columns:1fr}}
/* Botones */
.btn{display:inline-block;background:var(--cobre);color:#fff;text-decoration:none;
  padding:.8em 1.3em;border-radius:9px;font-weight:700;text-align:center}
.btn:hover{background:var(--cobre-oscuro)}
.btn.sec{background:#fff;color:var(--tinta);border:1px solid var(--borde)}
.btn.sec:hover{background:var(--crema)}
.cta{margin-top:1.6em;text-align:center}
.cta .nota{color:var(--secundario);font-size:.9em;margin:.7em 0 0}
/* Barra inferior */
.cta-bar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);
  border-top:1px solid var(--borde);padding:.7em 1em;display:flex;gap:.7em;
  justify-content:center;box-shadow:0 -2px 12px rgba(23,38,60,.08)}
.cta-bar .btn{flex:1;max-width:360px}
.cta-bar .btn.sec{flex:0 1 auto;white-space:nowrap}
@media (min-width:768px){
  .cta-bar{position:static;box-shadow:none;border:1px solid var(--borde);
    border-radius:12px;margin:1.6em auto 0;max-width:720px}
  main{padding-bottom:1.5em}
}
/* Estados: cargando / error */
.estado{background:var(--card);border:1px solid var(--borde);border-radius:14px;
  padding:2.2em 1.5em;text-align:center;box-shadow:0 1px 3px rgba(23,38,60,.08)}
.estado p{margin:.4em 0}
.estado .titulo{font-size:1.15em;font-weight:700}
.estado .detalle{color:var(--secundario)}
.estado .acciones{margin-top:1.2em;display:flex;gap:.7em;justify-content:center;flex-wrap:wrap}
.spinner{width:34px;height:34px;margin:0 auto .8em;border-radius:50%;
  border:3px solid var(--cobre-suave);border-top-color:var(--cobre);
  animation:girar 1s linear infinite}
@keyframes girar{to{transform:rotate(360deg)}}
/* Pie */
footer.site{max-width:720px;margin:0 auto;padding:0 1em 7em;text-align:center;
  color:var(--secundario);font-size:.9em}
@media (min-width:768px){footer.site{padding-bottom:2em}}
footer.site a{color:var(--secundario)}
</style>
</head>
<body>
<header class="site">
  <div class="wrap">
    <a class="brand" href="index.html"><span class="monograma">CP</span>Cuba<b>Pincha</b></a>
    <nav><a href="index.html">Todas las ofertas</a></nav>
  </div>
</header>
<main>
  <div id="estado"></div>
  <div id="oferta" hidden></div>
</main>
<div class="cta-bar" id="barra" hidden>
  <a class="btn" id="btnAppBar" href="#">Abrir en la app</a>
  <a class="btn sec" href="https://henrytmr.github.io/cubapincha/">Ver todas las ofertas</a>
</div>
<footer class="site"><a href="index.html">Ver todas las ofertas en CubaPincha</a> · Contacto:
<a href="mailto:henryruztamayo@gmail.com">henryruztamayo@gmail.com</a></footer>
<script>
(function () {
  var API = "https://ogimwehtnhegfoamiwzm.supabase.co/functions/v1/api";
  var estado = document.getElementById("estado");
  var caja = document.getElementById("oferta");
  var barra = document.getElementById("barra");
  var btnAppBar = document.getElementById("btnAppBar");
  var params = new URLSearchParams(window.location.search);
  var id = params.get("id") || "";

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function dinero(n) {
    if (n == null || n === "" || isNaN(+n)) return "";
    return Number(n).toLocaleString("es-CU");
  }
  function fecha(iso) {
    if (!iso) return "";
    var d = new Date(iso);
    if (isNaN(d)) return "";
    return d.toLocaleDateString("es-CU", {day: "numeric", month: "long", year: "numeric"});
  }
  function periodo(p) {
    var m = {mensual: "al mes", quincenal: "a la quincena", semanal: "a la semana",
      diario: "al día", por_hora: "por hora", por_proyecto: "por proyecto",
      comision: "por comisión", a_convenir: "a convenir"};
    return m[p] || p || "";
  }
  function mostrarEstado(html) {
    estado.innerHTML = "<div class=\"estado\">" + html + "</div>";
    estado.hidden = false;
    caja.hidden = true;
    barra.hidden = true;
  }
  function mostrarCargando() {
    mostrarEstado("<div class=\"spinner\"></div>" +
      "<p class=\"titulo\">Cargando la oferta…</p>" +
      "<p class=\"detalle\">Un momento, por favor.</p>");
  }
  function mostrarError(msg) {
    mostrarEstado("<p class=\"titulo\">" + esc(msg) + "</p>" +
      "<p class=\"detalle\">Si el problema continúa, vuelve a intentarlo en un momento.</p>" +
      "<div class=\"acciones\">" +
      "<a class=\"btn\" href=\"\" onclick=\"location.reload();return false;\">Reintentar</a>" +
      "<a class=\"btn sec\" href=\"index.html\">Volver a CubaPincha</a></div>");
  }

  mostrarCargando();

  if (!id) {
    mostrarError("No se indicó ninguna oferta en el enlace.");
    return;
  }

  fetch(API, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({action: "publicJob", id: id})
  })
  .then(function (r) { return r.json(); })
  .then(function (res) {
    if (!res || !res.ok || !res.data) {
      var msg = (res && res.error && res.error.message) || "No se pudo cargar la oferta.";
      mostrarError(msg === "Oferta no encontrada." ?
        "Esta oferta ya no está disponible." : msg);
      return;
    }
    var o = res.data;
    document.title = o.title + " — CubaPincha";
    var lugar = [o.municipalityName, o.provinceName].filter(Boolean).join(", ");
    var pin = "<svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" " +
      "stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" " +
      "stroke-linejoin=\"round\"><path d=\"M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z\"/>" +
      "<circle cx=\"12\" cy=\"10\" r=\"3\"/></svg>";
    var salario = "";
    if (o.salaryMin != null || o.salaryMax != null) {
      var min = dinero(o.salaryMin), max = dinero(o.salaryMax);
      var rango = min && max ? min + " – " + max : (max || min);
      salario = "<section class=\"salario\">" +
        "<p class=\"etiqueta\">Salario</p>" +
        "<p class=\"cantidad\">" + esc(rango) + " CUP" +
        (periodo(o.salaryPeriod) ? " <span>" + esc(periodo(o.salaryPeriod)) + "</span>" : "") + "</p>" +
        (o.paymentNotes ? "<p class=\"notas\">" + esc(o.paymentNotes) + "</p>" : "") +
        "</section>";
    }
    function lista(titulo, items) {
      if (!items || !items.length) return "";
      return "<h2 class=\"sec\">" + titulo + "</h2><ul class=\"lista\">" +
        items.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>";
    }
    function detalle(etiqueta, valor) {
      if (valor == null || valor === "") return "";
      return "<div><dt>" + etiqueta + "</dt><dd>" + esc(valor) + "</dd></div>";
    }
    var detalles = "";
    detalles += detalle("Categoría", o.category);
    detalles += detalle("Modalidad", o.workMode);
    detalles += detalle("Tipo de contrato", o.contractType);
    detalles += detalle("Zona", o.locality);
    detalles += detalle("Fecha de inicio", o.startDate);
    detalles += detalle("Horario de contacto", o.contactHours);
    detalles += detalle("Experiencia mínima",
      o.experienceMin != null ? o.experienceMin + (o.experienceMin === 1 ? " año" : " años") : "");
    if (detalles) {
      detalles = "<h2 class=\"sec\">Detalles de la oferta</h2><dl class=\"detalles\">" + detalles + "</dl>";
    }

    var appUrl = "cubapincha://oferta/" + encodeURIComponent(o.jobId);
    caja.innerHTML =
      "<article class=\"card hero\">" +
      "<div class=\"chips\">" +
      (o.category ? "<span class=\"chip\">" + esc(o.category) + "</span>" : "") +
      (o.publishedAt ? "<span class=\"fecha\">Publicada: " + esc(fecha(o.publishedAt)) + "</span>" : "") +
      "</div>" +
      "<h1>" + esc(o.title) + "</h1>" +
      "<p class=\"company\">" + esc(o.companyName) +
      (o.companyVerified ? "<span class=\"badge\">✓ Verificada</span>" : "") + "</p>" +
      (lugar ? "<p class=\"lugar\">" + pin + esc(lugar) + "</p>" : "") +
      "</article>" +
      salario +
      (o.description ? "<h2 class=\"sec\">Descripción</h2><div class=\"desc\"><p>" +
        esc(o.description) + "</p></div>" : "") +
      detalles +
      lista("Responsabilidades", o.responsibilities) +
      lista("Requisitos", o.requirements) +
      lista("Beneficios", o.benefits) +
      "<div class=\"cta\">" +
      "<a class=\"btn\" href=\"" + appUrl + "\">Abrir en la app</a>" +
      "<p class=\"nota\">Si no tienes la app instalada, puedes pedir el APK al equipo de CubaPincha.</p>" +
      "</div>";
    estado.hidden = true;
    caja.hidden = false;
    btnAppBar.href = appUrl;
    barra.hidden = false;
  })
  .catch(function () {
    mostrarError("No se pudo conectar. Revisa tu conexión e inténtalo de nuevo.");
  });
})();
</script>
</body>
</html>
