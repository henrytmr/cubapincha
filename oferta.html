<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CubaPincha — Oferta de trabajo</title>
<style>
body{font-family:system-ui,sans-serif;max-width:720px;margin:2em auto;padding:0 1em;line-height:1.6;color:#222}
h1{font-size:1.6em;margin-bottom:.2em}
h2{font-size:1.1em;margin-top:1.5em}
.muted{color:#666;font-size:.9em}
.badge{display:inline-block;background:#e8f5e9;color:#2e7d32;border-radius:4px;padding:0 .4em;font-size:.85em;margin-left:.4em}
.salario{font-size:1.2em;font-weight:bold}
.btn{display:inline-block;background:#1565c0;color:#fff;text-decoration:none;padding:.7em 1.2em;border-radius:6px;margin-top:1em}
.btn.sec{background:#eee;color:#222}
ul{padding-left:1.2em}
.card{border:1px solid #ddd;border-radius:8px;padding:1em 1.2em}
footer{margin-top:2em;font-size:.9em;color:#666}
</style>
</head>
<body>
<h1>CubaPincha</h1>
<div id="estado"><p>Cargando la oferta…</p></div>
<div id="oferta" hidden></div>
<footer><a href="index.html">Ver todas las ofertas en CubaPincha</a> · Contacto:
<a href="mailto:henryruztamayo@gmail.com">henryruztamayo@gmail.com</a></footer>
<script>
(function () {
  var API = "https://ogimwehtnhegfoamiwzm.supabase.co/functions/v1/api";
  var estado = document.getElementById("estado");
  var caja = document.getElementById("oferta");
  var params = new URLSearchParams(window.location.search);
  var id = params.get("id") || "";

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function dinero(n) {
    if (n == null || n === "" || isNaN(+n)) return "";
    return Number(n).toLocaleString("es-CU");
  }
  function fecha(iso) {
    if (!iso) return "";
    var d = new Date(iso);
    if (isNaN(d)) return "";
    return d.toLocaleDateString("es-CU", {day: "numeric", month: "long", year: "numeric"});
  }
  function periodo(p) {
    var m = {mensual: "al mes", quincenal: "a la quincena", semanal: "a la semana",
      diario: "al día", por_hora: "por hora", por_proyecto: "por proyecto",
      comision: "por comisión", a_convenir: "a convenir"};
    return m[p] || p || "";
  }
  function mostrarError(msg) {
    estado.innerHTML = "<p>" + esc(msg) + "</p>" +
      "<p><a class=\"btn sec\" href=\"index.html\">Volver a CubaPincha</a></p>";
  }

  if (!id) {
    mostrarError("No se indicó ninguna oferta en el enlace.");
    return;
  }

  fetch(API, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({action: "publicJob", id: id})
  })
  .then(function (r) { return r.json(); })
  .then(function (res) {
    if (!res || !res.ok || !res.data) {
      var msg = (res && res.error && res.error.message) || "No se pudo cargar la oferta.";
      mostrarError(msg === "Oferta no encontrada." ?
        "Esta oferta ya no está disponible." : msg);
      return;
    }
    var o = res.data;
    document.title = o.title + " — CubaPincha";
    var lugar = [o.municipalityName, o.provinceName].filter(Boolean).join(", ");
    var salario = "";
    if (o.salaryMin != null || o.salaryMax != null) {
      var min = dinero(o.salaryMin), max = dinero(o.salaryMax);
      salario = "<p class=\"salario\">" + esc(min && max ? min + " – " + max : (max || min)) +
        " CUP <span class=\"muted\">" + esc(periodo(o.salaryPeriod)) + "</span></p>";
    }
    function lista(titulo, items) {
      if (!items || !items.length) return "";
      return "<h2>" + titulo + "</h2><ul>" +
        items.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>";
    }
    var detalles = [];
    if (o.category) detalles.push("Categoría: " + o.category);
    if (o.workMode) detalles.push("Modalidad: " + o.workMode);
    if (o.contractType) detalles.push("Contrato: " + o.contractType);
    if (o.locality) detalles.push("Zona: " + o.locality);
    if (o.startDate) detalles.push("Inicio: " + esc(o.startDate));
    if (o.contactHours) detalles.push("Horario de contacto: " + o.contactHours);
    if (o.experienceMin != null) detalles.push("Experiencia mínima: " + o.experienceMin + " años");

    caja.innerHTML =
      "<div class=\"card\">" +
      "<h1>" + esc(o.title) + "</h1>" +
      "<p><strong>" + esc(o.companyName) + "</strong>" +
      (o.companyVerified ? "<span class=\"badge\">Verificada</span>" : "") + "</p>" +
      (lugar ? "<p class=\"muted\">" + esc(lugar) + "</p>" : "") +
      salario +
      "<p>" + esc(o.description) + "</p>" +
      (detalles.length ? "<p class=\"muted\">" + detalles.map(esc).join("<br>") + "</p>" : "") +
      (o.paymentNotes ? "<p class=\"muted\">Pago: " + esc(o.paymentNotes) + "</p>" : "") +
      "</div>" +
      lista("Responsabilidades", o.responsibilities) +
      lista("Requisitos", o.requirements) +
      lista("Beneficios", o.benefits) +
      "<p class=\"muted\">Publicada: " + esc(fecha(o.publishedAt)) + "</p>" +
      "<p><a class=\"btn\" href=\"cubapincha://oferta/" + encodeURIComponent(o.jobId) + "\">Abrir en la app</a></p>" +
      "<p class=\"muted\">Si no tienes la app instalada, puedes pedir el APK al equipo de CubaPincha.</p>";
    estado.hidden = true;
    caja.hidden = false;
  })
  .catch(function () {
    mostrarError("No se pudo conectar. Revisa tu conexión e inténtalo de nuevo.");
  });
})();
</script>
</body>
</html>
