workflows:
  android-debug:
    name: CubaPincha Android 2.11.0 conectado desde fuente completa
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 21
    scripts:
      - name: Extract complete corrected source
        script: |
          unzip -q cuba-pincha-android-source-full-corrected.zip
          chmod +x codigo-fuente/gradlew
      - name: Assemble connected debug APK
        script: |
          cd codigo-fuente
          ./gradlew assembleDebug --stacktrace
    artifacts:
      - codigo-fuente/app/build/outputs/**/*.apk
